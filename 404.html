<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CourtBook — Κρατήσεις γηπέδων</title>
<meta name="description" content="Κλείσε γήπεδο, δες τις προπονήσεις σου και βρες συμπαίκτες — online, από το κινητό.">
<meta property="og:title" content="CourtBook — Κρατήσεις γηπέδων">
<meta property="og:description" content="Κλείσε γήπεδο, δες τις προπονήσεις σου και βρες συμπαίκτες — online, από το κινητό.">
<meta property="og:image" content="https://court-book.gr/img/og-image.jpg">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/favicon.png">
<script>
/* Καθαρά links των clubs: court-book.gr/<slug> → η εφαρμογή του club.
   Κρατά ό,τι άλλο έχει το link (?join=, ?clinic=, επιστροφή πληρωμής, #token ανάκτησης κωδικού). */
(function(){
    var seg = location.pathname.replace(/^\/+|\/+$/g, '');
    if (/^[a-z0-9][a-z0-9-]{1,63}$/i.test(seg)) {
        var q = new URLSearchParams(location.search);
        q.set('club', seg.toLowerCase());
        location.replace('/app2.html?' + q.toString() + location.hash);
    }
})();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f2ee;color:#0f172a;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  a{color:#2563eb;font-weight:600;text-decoration:none}
  .box{max-width:360px} h1{font-size:22px;margin:16px 0 8px} p{color:#64748b;font-size:15px;line-height:1.5}
</style>
</head>
<body>
  <div class="box">
    <img src="/img/logo.png" alt="CourtBook" width="64" height="64" style="border-radius:14px">
    <h1>Η σελίδα δεν βρέθηκε</h1>
    <p>Έλεγξε το link ή ζήτησέ το ξανά από το club σου.</p>
    <p><a href="/">← court-book.gr</a></p>
  </div>
</body>
</html>
